x-api-service-base: &api-service-base
  build: ./api-service
  env_file:
    - ./api-service/.env
  environment:
    REDIS_URL: redis://redis:6379
    EMBEDDING_SERVICE_URL: http://embedding-service:8000
  depends_on:
    redis:
      condition: service_healthy
    embedding-service:
      condition: service_started
  restart: unless-stopped

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  embedding-service:
    build: ./embedding-service
    env_file:
      - ./embedding-service/.env
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"
    restart: unless-stopped

  api-service:
    <<: *api-service-base
    ports:
      - "3000:3000"
    command: ["node", "dist/server.js"]

  api-worker:
    <<: *api-service-base
    command: ["node", "dist/worker.js"]

volumes:
  redis-data:
